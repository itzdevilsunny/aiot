services:
  # 1. Node.js Express Backend Service
  - type: web
    name: vision-aiot-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production

  # 2. Vite React Frontend Static Site
  - type: web
    name: vision-aiot-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
